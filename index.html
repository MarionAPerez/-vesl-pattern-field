<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VESL / Pattern Field</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.app {
  width: 360px;
  height: 640px;
  position: relative;
  text-align: center;
}

h1 {
  font-size: 12px;
  letter-spacing: 4px;
  opacity: 0.6;
}

canvas {
  margin-top: 20px;
}

.controls {
  position: absolute;
  bottom: 20px;
  width: 100%;
}

button {
  margin: 5px;
  padding: 8px 12px;
  background: none;
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
  <h1>VESL / PATTERN FIELD</h1>

  <canvas id="canvas" width="320" height="400"></canvas>

  <div class="controls">
    <button onclick="add()">+ Moment</button>
    <button onclick="seal()">Seal Day</button>
    <button onclick="viewField()">Field</button>
    <button onclick="reset()">Reset</button>
  </div>
</div>

<script>
const ctx = document.getElementById("canvas").getContext("2d");

let todayKey = getDateKey();
let mode = "today";

function getDateKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}

function load(key) {
  return JSON.parse(localStorage.getItem(key) || '{"dots":[],"sealed":false}');
}

function save(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function add() {
  let data = load(todayKey);

  let x = Math.random() * 280 + 20;
  let y = Math.random() * 320 + 40;

  data.dots.push({
    x, y,
    createdAt: Date.now()
  });

  save(todayKey, data);
}

function seal() {
  let data = load(todayKey);
  data.sealed = true;
  save(todayKey, data);
}

function getAllDays() {
  let days = [];

  for (let i = 0; i < localStorage.length; i++) {
    let key = localStorage.key(i);

    if (key.match(/^\d{4}-\d{2}-\d{2}$/)) {
      let data = load(key);
      if (data.sealed && data.dots.length > 1) {
        days.push({ key, data });
      }
    }
  }

  return days.sort((a,b)=>a.key.localeCompare(b.key));
}

function drawWave(dots, opacity) {
  if (dots.length < 2) return;

  ctx.beginPath();
  ctx.moveTo(dots[0].x, dots[0].y);

  for (let i=1;i<dots.length;i++) {
    ctx.lineTo(dots[i].x, dots[i].y);
  }

  ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
  ctx.stroke();
}

function drawDots(dots, opacity) {
  dots.forEach(d=>{
    ctx.beginPath();
    ctx.arc(d.x,d.y,4,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
    ctx.fill();
  });
}

function draw() {
  ctx.clearRect(0,0,320,400);

  if (mode === "today") {
    let data = load(todayKey);
    drawWave(data.dots,0.8);
    drawDots(data.dots,1);
  }

  if (mode === "field") {
    let days = getAllDays();

    days.forEach((day,i)=>{
      let opacity = 0.2 + (i/days.length)*0.5;
      drawWave(day.data.dots,opacity);
      drawDots(day.data.dots,opacity);
    });
  }

  requestAnimationFrame(draw);
}

function viewField() {
  mode = "field";
}

function reset() {
  localStorage.clear();
}

draw();
</script>

</body>
</html>
